<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RealmDev — 8-Bit MMORPG Dev Community</title>
<meta name="description" content="RealmDev is a community hub for 8-bit bullet-hell MMORPG development — source code releases, tutorials, help requests, project showcases, and server advertising.">
<link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body class="game-page">

<header class="site-header">
  <div class="wrap header-inner">
    <a href="/" class="logo">
      <img src="assets/realmdev-logo.png" alt="RealmDev" class="logo-icon">
    </a>
    <nav class="site-nav">
      <a href="https://forum.realmdev.org" target="_blank" rel="noopener">Forums</a>
      <a href="/developers">Developers</a>
    </nav>
  </div>
</header>

<main>
  <div id="scene-root">
    <canvas id="scene-canvas"></canvas>

    <div id="scene-loading">
      <p class="loading-text">Loading the Nexus&hellip;</p>
    </div>

    <div id="scene-hint" hidden>
      <p><span class="key">WASD</span> / <span class="key">Arrows</span> to walk &nbsp;&bull;&nbsp; walk into a portal or tap it to enter</p>
    </div>

    <div id="touch-joystick" hidden>
      <div id="joystick-base"><div id="joystick-knob"></div></div>
    </div>

    <div id="scene-fallback" hidden>
      <p>Your browser can't render the 3D Nexus, but the realm is still open:</p>
      <div class="cta-row">
        <a class="btn btn-primary" href="https://forum.realmdev.org" target="_blank" rel="noopener">Enter the Forums</a>
        <a class="btn btn-ghost" href="/developers">Developers</a>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-nav">
      <a href="/">Home</a>
      <a href="https://forum.realmdev.org" target="_blank" rel="noopener">Forums</a>
      <span class="soon">Media (soon)</span>
      <a href="https://github.com/programasalami/RealmDev" target="_blank" rel="noopener">GitHub</a>
    </div>
    <p class="footer-copy">© 2026 RealmDev. Built pixel by pixel.</p>
  </div>
</footer>

<script type="module" src="js/scene.js"></script>
</body>
</html>
