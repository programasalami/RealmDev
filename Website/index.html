<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RealmDev — 8-Bit MMORPG Dev Community</title>
<meta name="description" content="RealmDev is a community hub for 8-bit bullet-hell MMORPG development — source code releases, tutorials, help requests, project showcases, and server advertising.">
<link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script>
  // Watchdog: if the 3D scene hasn't reported ready within a few seconds
  // (old browser, blocked GPU, network hiccup, whatever), fall back to
  // plain buttons instead of leaving people stuck on a loading screen.
  window.__realmScene = { ready: false };
  setTimeout(function () {
    if (window.__realmScene.ready) return;
    var loading = document.getElementById('scene-loading');
    var fallback = document.getElementById('scene-fallback');
    if (loading) loading.hidden = true;
    if (fallback) fallback.hidden = false;
    // Note: if scene.js finishes loading after this point, it un-hides
    // itself and re-hides this fallback — success always wins.
  }, 18000);
</script>
</head>
<body class="game-page">

<main>
  <div id="scene-root">
    <div id="game-view">
      <canvas id="scene-canvas"></canvas>

      <div id="scene-loading">
        <p class="loading-text">Loading the Nexus&hellip;</p>
      </div>

      <div id="touch-joystick" hidden>
        <div id="joystick-base"><div id="joystick-knob"></div></div>
      </div>

      <div id="scene-fallback" hidden>
        <p>Your browser can't render the 3D Nexus, but the realm is still open:</p>
        <div class="cta-row">
          <a class="btn btn-primary" href="https://forum.realmdev.org" target="_blank" rel="noopener">Enter the Forums</a>
          <a class="btn btn-ghost" href="/realmtube">Realmtube</a>
        </div>
      </div>
    </div>

    <aside id="hud">
      <div id="minimap-wrap">
        <canvas id="minimap-canvas" width="200" height="140"></canvas>
      </div>

      <div class="hud-name">MonsterSlayer99</div>

      <div class="stat-bars">
        <div class="stat-bar-track">
          <div class="stat-bar-fill hp"></div>
          <span class="stat-bar-text">HP</span>
        </div>
        <div class="stat-bar-track">
          <div class="stat-bar-fill mp"></div>
          <span class="stat-bar-text">MP</span>
        </div>
      </div>

      <div class="inv-grid">
        <div class="inv-slot"></div>
        <div class="inv-slot"></div>
        <div class="inv-slot"></div>
        <div class="inv-slot"></div>
        <div class="inv-slot"></div>
        <div class="inv-slot"></div>
        <div class="inv-slot"></div>
        <div class="inv-slot"></div>
      </div>

      <ul class="hud-tips">
        <li>WASD or Arrow Keys to walk</li>
        <li>Drag to look around</li>
        <li>Tap to interact with some features</li>
      </ul>
    </aside>
  </div>
</main>

<script type="module" src="js/scene.js"></script>
</body>
</html>
